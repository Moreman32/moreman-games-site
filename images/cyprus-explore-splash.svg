<svg viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="55%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>
    <!-- Sea gradient -->
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <!-- Pin shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <!-- Text shadow -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <!-- Cloud blur -->
    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="390" height="844" fill="url(#skyGrad)"/>

  <!-- Clouds left -->
  <ellipse cx="60" cy="190" rx="55" ry="20" fill="white" opacity="0.7" filter="url(#cloudBlur)"/>
  <ellipse cx="90" cy="178" rx="35" ry="16" fill="white" opacity="0.75" filter="url(#cloudBlur)"/>

  <!-- Clouds right -->
  <ellipse cx="330" cy="200" rx="50" ry="18" fill="white" opacity="0.65" filter="url(#cloudBlur)"/>
  <ellipse cx="355" cy="190" rx="30" ry="14" fill="white" opacity="0.7" filter="url(#cloudBlur)"/>

  <!-- Mountains background (hazy) -->
  <polygon points="0,620 80,510 160,560 240,490 320,540 390,505 390,640 0,640" fill="#1976D2" opacity="0.6"/>
  <polygon points="0,640 70,540 140,580 210,520 290,560 360,530 390,545 390,660 0,660" fill="#1565C0" opacity="0.8"/>

  <!-- Sea -->
  <rect x="0" y="650" width="390" height="194" fill="url(#seaGrad)"/>

  <!-- Sea waves -->
  <path d="M0,670 Q25,660 50,670 Q75,680 100,670 Q125,660 150,670 Q175,680 200,670 Q225,660 250,670 Q275,680 300,670 Q325,660 350,670 Q375,680 390,670 L390,695 L0,695 Z" fill="#1976D2" opacity="0.6"/>
  <path d="M0,690 Q30,680 60,692 Q90,704 120,690 Q150,678 180,692 Q210,704 240,690 Q270,678 300,692 Q330,704 360,690 Q380,683 390,688 L390,720 L0,720 Z" fill="#1565C0" opacity="0.5"/>
  <path d="M0,710 Q40,700 80,712 Q120,724 160,710 Q200,696 240,710 Q280,724 320,710 Q355,698 390,708 L390,740 L0,740 Z" fill="#0D47A1" opacity="0.4"/>

  <!-- Cliff / coastline right -->
  <path d="M280,650 Q310,620 340,630 Q365,615 390,625 L390,660 Q360,655 330,660 Q305,665 280,660 Z" fill="#5D4037" opacity="0.8"/>
  <path d="M280,660 Q310,655 340,660 Q365,658 390,660 L390,720 Q360,710 320,715 Q295,718 280,715 Z" fill="#4E342E" opacity="0.7"/>
  <!-- Beach strip -->
  <path d="M220,658 Q250,648 280,655 Q310,662 340,656 Q365,651 390,655 L390,672 Q360,668 330,673 Q300,678 270,673 Q245,668 220,672 Z" fill="#F5DEB3" opacity="0.85"/>

  <!-- Location pin -->
  <g transform="translate(195,90)" filter="url(#shadow)">
    <!-- Pin body -->
    <path d="M0,-100 C-55,-100 -85,-55 -85,0 C-85,55 0,130 0,130 C0,130 85,55 85,0 C85,-55 55,-100 0,-100 Z" fill="white"/>
    <!-- Pin inner circle -->
    <circle cx="0" cy="0" r="58" fill="#E3F2FD"/>
    <!-- Cyprus island silhouette (simplified) -->
    <g transform="scale(0.9)">
      <path d="
        M-42,5
        C-40,-2 -35,-8 -28,-12
        C-22,-16 -15,-18 -8,-17
        C-4,-16 0,-15 5,-16
        C10,-17 16,-20 22,-19
        C28,-18 34,-14 38,-9
        C42,-4 44,2 43,8
        C42,14 38,18 33,20
        C28,22 22,21 17,19
        C12,17 8,14 3,13
        C-2,12 -7,13 -12,15
        C-16,17 -20,20 -25,21
        C-30,22 -35,20 -39,16
        C-43,12 -44,8 -42,5 Z
        M22,-8 C24,-10 27,-12 30,-11 C32,-10 33,-7 31,-5 C29,-3 26,-2 24,-4 C22,-6 21,-7 22,-8 Z
      " fill="#F9A825"/>
    </g>
  </g>

  <!-- App name "Cyprus" -->
  <text x="195" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700"
        fill="white" text-anchor="middle" filter="url(#textShadow)">Cyprus</text>

  <!-- Subtitle "— EXPLORE —" -->
  <text x="195" y="335" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600"
        fill="#F9A825" text-anchor="middle" letter-spacing="8">— EXPLORE —</text>

  <!-- Decorative lines around EXPLORE -->
  <line x1="40" y1="320" x2="108" y2="320" stroke="#F9A825" stroke-width="1.5" opacity="0.7"/>
  <line x1="282" y1="320" x2="350" y2="320" stroke="#F9A825" stroke-width="1.5" opacity="0.7"/>
</svg>
